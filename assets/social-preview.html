<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* GitHub social preview card — 1280x640, rendered to PNG by
     scripts/build-social-preview.mjs (`npm run social`).

     Designed thumbnail-first. This card is almost never seen at full size: it
     appears as a ~360-400px unfurl in Slack, X and LinkedIn. Everything here is
     sized so it survives a 3x downscale — which is why the copy is short, the
     labels are large, and there is no chip row or fine print. Check changes with
     the thumbnail test in the build script before committing. */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink:     #0b1020;
    --ink-2:   #161e38;
    --brass:   #f7bf4a;
    --brass-d: #dc9d1c;
    --text:    #f4f7fd;
    --muted:   #a3b0cd;
    --line:    rgba(255,255,255,.10);
  }

  body {
    width: 1280px; height: 640px; overflow: hidden;
    background: var(--ink);
    color: var(--text);
    font-family: "Segoe UI", Inter, -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  .glow {
    position: absolute; top: -300px; right: -200px;
    width: 860px; height: 860px; border-radius: 50%;
    background: radial-gradient(circle, rgba(247,191,74,.20) 0%, rgba(247,191,74,.06) 40%, transparent 66%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: linear-gradient(120deg, #000 0%, transparent 58%);
    opacity: .5;
  }

  .card { position: relative; height: 100%; padding: 66px 76px 60px; display: flex; flex-direction: column; }

  /* ---------- wordmark: must be legible at 1/3 scale ---------- */
  .brand { display: flex; align-items: center; gap: 24px; }
  .bell {
    width: 96px; height: 96px; border-radius: 26px; flex: none;
    background: linear-gradient(160deg, var(--brass) 0%, var(--brass-d) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 52px; line-height: 1;
    box-shadow: 0 16px 46px rgba(247,191,74,.30);
  }
  h1 { font-size: 82px; font-weight: 700; letter-spacing: -2.8px; line-height: 1; }
  h1 b { color: var(--brass); font-weight: 700; }

  .tagline {
    margin-top: 40px;
    font-size: 52px; font-weight: 600; letter-spacing: -1.6px; line-height: 1.12;
  }
  /* One line, ~9 words. Anything longer is unreadable in a feed. */
  .sub {
    margin-top: 22px;
    font-size: 31px; font-weight: 400; color: var(--muted); line-height: 1.4;
    max-width: 1140px;   /* keeps the subline to ONE line — it wraps badly at 3x downscale */
    white-space: nowrap;
  }
  .sub em { color: var(--text); font-style: normal; font-weight: 600; }

  /* ---------- three stats, short labels only ---------- */
  .stats { margin-top: auto; display: flex; gap: 18px; }
  .stat {
    flex: 1; padding: 26px 30px; border-radius: 20px;
    background: var(--ink-2); border: 1px solid var(--line);
  }
  .stat .n { font-size: 46px; font-weight: 700; letter-spacing: -1.6px; color: var(--brass); line-height: 1; }
  .stat .l { margin-top: 12px; font-size: 24px; font-weight: 500; color: var(--muted); line-height: 1.25; }

  .foot {
    margin-top: 34px; text-align: center;
    font-size: 26px; font-weight: 500; color: var(--muted); letter-spacing: .2px;
  }
  .foot b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <div class="card">
    <div class="brand">
      <div class="bell">🔔</div>
      <h1>Desk<b>Bell</b></h1>
    </div>

    <div class="tagline">The front desk that never sleeps.</div>
    <div class="sub">
      Open-source <em>appointment reminders</em> &amp; <em>missed-call recovery</em> for n8n.
    </div>

    <div class="stats">
      <div class="stat">
        <div class="n">10&ndash;30%</div>
        <div class="l">of slots lost<br>to no-shows</div>
      </div>
      <div class="stat">
        <div class="n">&lt; 5%</div>
        <div class="l">with reminders<br>+ waitlist</div>
      </div>
      <div class="stat">
        <div class="n">$0</div>
        <div class="l">self-hosted,<br>your data</div>
      </div>
    </div>

    <div class="foot">WhatsApp &nbsp;·&nbsp; SMS &nbsp;·&nbsp; AI voice &nbsp;·&nbsp; Email &nbsp;&nbsp;&mdash;&nbsp;&nbsp; <b>MIT</b></div>
  </div>
</body>
</html>
